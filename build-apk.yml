name: Build Alsaer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract app project
        run: unzip -q alsaer-apk-project.zip -d source

      - name: Install dependencies
        working-directory: source/tawba-apk
        run: npm install

      - name: Build Android APK
        working-directory: source/tawba-apk
        run: |
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alsaer-ila-allah-apk
          path: source/tawba-apk/android/app/build/outputs/apk/debug/app-debug.apk


name: Build Alsaer APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project archive
        run: |
          test -f alsaer-project-hardened.zip
          unzip -t alsaer-project-hardened.zip

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q alsaer-project-hardened.zip -d source
          test -f source/tawba-apk/package.json
          test -f source/tawba-apk/capacitor.config.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: source/tawba-apk
        run: npm install

      - name: Add Android platform
        working-directory: source/tawba-apk
        run: npx cap add android

      - name: Generate app icons
        working-directory: source/tawba-apk
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0e6a62' \
            --iconBackgroundColorDark '#0a3d3a'

      - name: Sync Capacitor
        working-directory: source/tawba-apk
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: source/tawba-apk
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alsaer-ila-allah-apk
          path: source/tawba-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


name: Build Alsaer 2.1.0 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify archive
        run: |
          test -f alsaer-v2.1.0-transactional-ready.zip
          unzip -t alsaer-v2.1.0-transactional-ready.zip

      - name: Extract source
        run: |
          mkdir -p source
          unzip -q alsaer-v2.1.0-transactional-ready.zip -d source
          test -f source/alsaer-v2-repaired/tawba-apk/package.json
          test -f source/alsaer-v2-repaired/tawba-apk/capacitor.config.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: source/alsaer-v2-repaired/tawba-apk
        run: npm install --no-audit --no-fund

      - name: Add Android
        working-directory: source/alsaer-v2-repaired/tawba-apk
        run: npx cap add android

      - name: Sync Android
        working-directory: source/alsaer-v2-repaired/tawba-apk
        run: npx cap sync android

      - name: Build APK
        working-directory: source/alsaer-v2-repaired/tawba-apk
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alsaer-v2.1.0-debug-apk
          path: source/alsaer-v2-repaired/tawba-apk/android/app/build/outputs/apk/debug/app-debug.apk
